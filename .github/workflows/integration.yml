name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Run unit and default tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Start integration dependencies
        run: docker compose -f docker-compose.integration.yml up -d --wait postgres localstack
      - name: Run PostgreSQL and LocalStack integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:integration-owner@127.0.0.1:5432/postgres?sslmode=disable
          TEST_AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test -count=1 -run '^TestIntegration$' -v ./internal/worker
      - name: Stop integration dependencies
        if: always()
        run: docker compose -f docker-compose.integration.yml down --volumes --remove-orphans
